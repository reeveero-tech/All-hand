[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short -m "not network"
# R-072: tests that need the real internet are opt-in: pytest -m network
markers =
    network: needs the real internet (deselected by default; CI job `network`)
    allow_external_network: lifts the offline guard without deselecting (R-042 live storage)
filterwarnings =
    ignore::DeprecationWarning
