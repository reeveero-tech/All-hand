services:
  - type: web
    name: agos-civilization
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd web && npm install && npm run build
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/system/status
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      # R-041: يُقرأ فعلاً في server.py منذ هذه الدفعة (D-029). القيمة 3 خيار
      # محافظ قائم سابقاً؛ ملاءمته للموارد غير مقيسة.
      - key: AGENTS_PER_SPEC
        value: "3"
      # يستهلكه Render (المنصة) لا كود التطبيق (Q-007).
      # R-090: Render requires a full patch version here; latest 3.12 patch
      # (3.12.0 was the 2023 initial release). CI tests 3.12 in job `test`.
      - key: PYTHON_VERSION
        value: "3.12.15"
      # SEC-03 (R-139): بيئة الإنتاج صريحة. الإنتاج لا يقلع بلا بيانات اعتماد
      # صالحة (AGOS_TENANT_KEYS و/أو AGOS_API_KEY)؛ وغياب AGOS_ENV يعني إنتاجاً
      # أيضاً. development/test مرفوضان على Render (RENDER=true تضبطه المنصة).
      - key: AGOS_ENV
        value: production
      # R-041 + SEC-02/SEC-03: مدخلا بيانات الاعتماد (sync:false = يدخل المشغّل
      # القيم في لوحة Render؛ لا سر في هذا الملف). تركهما فارغين = الخادم لا يقلع
      # (لا وضع مفتوح منذ R-139). AGOS_TENANT_KEYS: قائمة JSON بتجزئات SHA-256
      # (docs/governance/OPERATIONS.md)؛ AGOS_API_KEY: مفتاح المشغّل (admin، ≥16 حرفاً).
      - key: AGOS_TENANT_KEYS
        sync: false
      - key: AGOS_API_KEY
        sync: false
      # SEC-06 (R-145، D-059): المزود العام بلا مفتاح معطّل افتراضياً — الإنتاج
      # الآمن لا يحتاج ضبطه إطلاقاً. تفعيله قرار مشغّل صريح (القيمة 1 هنا في
      # لوحة Render)، وكل طلب يحتاج موافقته الصريحة (allow_public_llm) بعدها.
      # القيم غير الصالحة تمنع الإقلاع (لا تفسير ضمنياً كتفعيل).
      - key: AGOS_LLM_KEYLESS
        sync: false
      - key: AGOS_ALLOWED_ORIGINS
        sync: false
      # R-100 (D-044): اختياريان — تركهما فارغين هو الآمن. بلا AGOS_API_KEY يُرفض
      # تنفيذ كود test_runner؛ AGOS_ALLOW_CODE_EXEC=1 يسمح به للجميع (غير موصى
      # به على عنوان عام)، و AGOS_ALLOW_PRIVATE_NETWORK=1 يسمح بأهداف داخلية.
      - key: AGOS_ALLOW_CODE_EXEC
        sync: false
      - key: AGOS_ALLOW_PRIVATE_NETWORK
        sync: false
      - key: SUPABASE_URL
        sync: false
      # R-042b: المفتاح المفضّل للخادم (secret/service_role) — RLS مفعّل بلا سياسات anon.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # بدائل خلفية يقرأها supabase_store.py (واجهة web/ لا تقرأها).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
