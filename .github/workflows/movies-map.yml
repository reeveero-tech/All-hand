name: Movies Map

# R-206c (D-165): rebuild our own movie map from Wikidata (CC0) every week and
# publish it to the release "movies-map" of this repository; the server serves
# that asset at /api/v2/movies/map. A failed build keeps the last published map
# (the release is only replaced after a successful build). Never runs on PR
# events (write token).
on:
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:
    inputs:
      min_sitelinks:
        description: "minimum Wikipedia sitelinks per film (popularity floor)"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: movies-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Build the map from Wikidata
        env:
          MIN_SITELINKS: ${{ inputs.min_sitelinks || '20' }}
        run: python3 scripts/tools/build_movie_map.py --out out --min-sitelinks "$MIN_SITELINKS"
      - name: Publish to the release movies-map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view movies-map -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create movies-map -R "$GITHUB_REPOSITORY" --latest=false \
              --title "Movies map (Wikidata, CC0)" \
              --notes "Built by .github/workflows/movies-map.yml from Wikidata (CC0 1.0). Served at /api/v2/movies/map (R-206c, D-165)."
          fi
          gh release upload movies-map -R "$GITHUB_REPOSITORY" --clobber out/movies.json.gz out/build.json
