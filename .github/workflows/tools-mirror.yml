name: Tools Mirror

# R-206a (D-165): keep full copies of the open-source tools the owner asked for
# (agos_v2/tools_upstreams.json) in this repository's releases, and pick up
# upstream changes automatically. An archived or deleted upstream keeps its last
# copy. Never runs on PR events (write token + third-party code).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "tool id to refresh (empty = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tools-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Mirror upstreams
        env:
          GH_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.only }}
        run: python3 scripts/tools/mirror_upstreams.py --repo "$GITHUB_REPOSITORY" --only "$ONLY"
