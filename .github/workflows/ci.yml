name: AGOS Kernel CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.0
      
      - name: Lint with ruff (live code paths — Fatal only)
        run: |
          # Only fatal (F/E) rules block merge; style rules (UP, DTZ, BLE, ...) are warnings logged, not blockers.
          # Generated specialist proxies are excluded (see docs/governance/RISKS.md Q-004).
          ruff check --select F,E722 --exclude 'agent_civilization/agents/specialists' \
            server.py agent_civilization agos_kernel tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx2
      
      - name: Run tests (live test suite)
        run: pytest tests/ -v --cov=agent_civilization --cov=agos_kernel --cov-report=xml

  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No pip cache: build job does not install Python deps (R-012 pending)
      
      - name: Build server artifacts
        run: |
          # No packaging configured for the Python server yet — see ROADMAP R-012.
          echo "Server artifacts: no packaging configured yet."
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Build web frontend
        working-directory: web/
        run: |
          npm install --no-audit --no-fund
          npm run build

  publish:
    runs-on: ubuntu-latest
    needs: build
    # PyPI publish gated by R-030 (policy decision pending) — disabled until decided.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish]')
    steps:
      - uses: actions/checkout@v4
      
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: echo "PyPI publish disabled by R-030 (policy pending)."
