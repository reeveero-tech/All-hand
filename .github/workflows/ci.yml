name: AGOS Kernel CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1  # R-148: pinned (was a floating upgrade)
          pip install ruff==0.17.0
      
      - name: Lint with ruff (live code paths — Fatal only)
        run: |
          # Only fatal (F/E) rules block merge; style rules (UP, DTZ, BLE, ...) are warnings logged, not blockers.
          # R-032a: specialists/ package cleaned (explicit re-exports, no star
          # imports, no unused imports) — no longer excluded (see docs/governance/RISKS.md Q-004).
          ruff check --select F,E722 \
            server.py agent_civilization agos_kernel agos_v2 tests

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      # R-148: reproducible installs — the production lock (hashes enforced)
      # plus the separately-locked test tools (constrained to the same prod
      # versions). No floating resolution anywhere in CI.
      - name: Install dependencies (locked)
        run: |
          python -m pip install pip==26.2.1  # R-148: pinned (was a floating upgrade)
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
      
      # R-176 (M8 P6, D-133): pinned k6 for the load framework — the runner
      # installs the exact pinned version (SHA256-verified). The SMOKE profile
      # is small by design and runs inside the test suite below; the big-load
      # profiles (stress/spike/soak) are Q-023-gated (dedicated environment,
      # owner decision) and are NEVER run in CI.
      - name: Install k6 (R-176, pinned v0.57.0)
        run: python scripts/r176_load_framework.py --ensure-k6

      - name: Run tests (live test suite)
        run: pytest tests/ -v --cov=agent_civilization --cov=agos_kernel --cov-report=xml

      # R-090 (D-043): production runs Python 3.12 (Dockerfile python:3.12-slim,
      # render.yaml PYTHON_VERSION). Same job, second interpreter — a matrix would
      # rename the required check `test` (branch protection is owner-managed, Q-020).
      - name: Set up Python 3.12 (runtime version)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run tests on Python 3.12
        run: |
          python --version
          python -m pip install pip==26.2.1  # R-148: pinned (was a floating upgrade)
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock
          python -m pytest tests/ -q

      # R-158 (D-070, gap G-157-5): the server can be built on either agent
      # runtime (AGOS_AGENT_IMPL=real|specialists). The steps above exercise
      # the default (real) only; this step runs the same suite with the
      # server on the specialists runtime. Same job, so the required check
      # name `test` is unchanged (branch protection is owner-managed, Q-020).
      - name: Run tests on Python 3.12 with AGOS_AGENT_IMPL=specialists
        env:
          AGOS_AGENT_IMPL: specialists
        run: python -m pytest tests/ -q

  build:
    runs-on: ubuntu-26.04
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          # No pip cache: build job does not install Python deps (R-012 pending)
      
      - name: Build server artifacts
        run: |
          # No packaging configured for the Python server yet — see ROADMAP R-012.
          echo "Server artifacts: no packaging configured yet."
      
      # R-089: web/ moves to Node 22 (Node 20 EOL 2026-04-30); engines.node
      # >=22.12.0 in web/package.json, enforced by --engine-strict, clean from lockfile.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      
      - name: Build web frontend
        working-directory: web/
        run: |
          node --version
          npm ci --engine-strict --no-audit --no-fund
          npm run build

      # R-101: behaviour of the real web/src/api.js (X-API-Key, 401/403 messages).
      - name: Test web API client
        working-directory: web/
        run: npm test

      # R-203 (D-152, DEL-001): the root TanStack app (src/, root package.json)
      # was removed — never deployed; web/ above is the only frontend.

  docker:
    # R-040: verify the real Dockerfile builds and the container serves /health.
    # Ubuntu runners provide Docker; the sandbox used for docs work does not.
    runs-on: ubuntu-26.04
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          set -o pipefail
          docker build --no-cache -t agos:r040-smoke . 2>&1 | tee "$GITHUB_WORKSPACE/docker_build.log"
          echo "image_size=$(docker image inspect agos:r040-smoke --format '{{.Size}}')" | tee -a "$GITHUB_WORKSPACE/docker_build.log"

      - name: Verify production start is refused without credentials (SEC-03)
        run: |
          # SEC-03 (R-139): the image is production (ENV AGOS_ENV=production);
          # with neither AGOS_TENANT_KEYS nor AGOS_API_KEY it must exit with an
          # error instead of serving. Then: an explicit non-production value on a
          # deployed platform (RENDER=true) must be refused too.
          LOG="$GITHUB_WORKSPACE/docker_startup_refusal.log"
          set +e
          timeout 120 docker run --rm agos:r040-smoke > "$LOG" 2>&1; rc=$?
          timeout 120 docker run --rm -e AGOS_ENV=development -e RENDER=true agos:r040-smoke > "$LOG.render" 2>&1; rc2=$?
          set -e
          tail -5 "$LOG"; tail -5 "$LOG.render"
          echo "no_credentials_rc=$rc render_development_rc=$rc2" | tee -a "$LOG"
          { [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; } || { echo "FAIL: container without credentials did not refuse to start"; exit 1; }
          grep -q "production start refused: no credentials configured" "$LOG" || { echo "FAIL: refusal reason missing"; exit 1; }
          { [ "$rc2" -ne 0 ] && [ "$rc2" -ne 124 ]; } || { echo "FAIL: AGOS_ENV=development accepted with RENDER=true"; exit 1; }
          grep -q "not allowed on a deployed platform" "$LOG.render" || { echo "FAIL: platform refusal reason missing"; exit 1; }
          cat "$LOG.render" >> "$LOG"
          echo "PASS: production container refuses to start without credentials; development refused on RENDER=true" | tee -a "$LOG"

      - name: Run container and verify /health
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/docker_runtime.log"
          : > "$LOG"
          # SEC-02 (R-138): one ephemeral CI tenant (random per run, user role,
          # no AGOS_API_KEY) so the runtime-safety step can submit a task.
          CI_TENANT_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')
          echo "::add-mask::$CI_TENANT_KEY"
          echo "CI_TENANT_KEY=$CI_TENANT_KEY" >> "$GITHUB_ENV"
          CI_TENANT_SHA=$(python3 -c 'import hashlib,sys; print(hashlib.sha256(sys.argv[1].encode()).hexdigest())' "$CI_TENANT_KEY")
          docker run -d --name agos-r040 -p 18000:8000 \
            -e AGOS_TENANT_KEYS="[{\"tenant\": \"ci\", \"key_sha256\": \"$CI_TENANT_SHA\", \"role\": \"user\"}]" \
            agos:r040-smoke
          echo "container_started_at=$(date -u +%FT%TZ)" | tee -a "$LOG"
          # Bounded startup wait: poll /health up to ~30s, fail fast on container exit.
          ok=0
          for i in $(seq 1 30); do
            if ! docker inspect -f '{{.State.Running}}' agos-r040 | grep -q true; then
              echo "container exited before answering; rc=container-failure" | tee -a "$LOG"
              break
            fi
            code=$(curl -s -o /tmp/health_body.json -w '%{http_code}' http://localhost:18000/health || echo 000)
            echo "attempt=$i http_code=$code" >> "$LOG"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          docker logs agos-r040 > "$GITHUB_WORKSPACE/docker_container.log" 2>&1 || true
          if [ "$ok" != "1" ]; then
            echo "FAIL: /health did not return 200" | tee -a "$LOG"
            exit 1
          fi
          # Assert the response is the health JSON, not a frontend fallback.
          grep -q '"status"' /tmp/health_body.json || { echo "FAIL: /health body is not health JSON"; cat /tmp/health_body.json; exit 1; }
          echo "health_body:" | tee -a "$LOG"
          cat /tmp/health_body.json | tee -a "$LOG"
          echo "PASS: /health returned 200 with health JSON" | tee -a "$LOG"

      - name: Verify runtime safety policy in the container (R-100)
        run: |
          set -o pipefail
          LOG="$GITHUB_WORKSPACE/docker_runtime.log"
          uid=$(docker exec agos-r040 id -u)
          echo "container_uid=$uid" | tee -a "$LOG"
          [ "$uid" != "0" ] || { echo "FAIL: container runs as root" | tee -a "$LOG"; exit 1; }
          # SEC-02 (R-138): an anonymous client cannot submit or read tasks at all.
          code=$(curl -s -o /tmp/anon.json -w '%{http_code}' -X POST http://localhost:18000/api/tasks \
                 -H 'Content-Type: application/json' -d '{"specialization":"test_runner","prompt":"print(1)"}')
          echo "anonymous_post_api_tasks=$code $(cat /tmp/anon.json)" | tee -a "$LOG"
          [ "$code" = "401" ] || { echo "FAIL: anonymous task submission not refused" | tee -a "$LOG"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18000/api/tasks)
          echo "anonymous_get_api_tasks=$code" | tee -a "$LOG"
          [ "$code" = "401" ] || { echo "FAIL: anonymous task listing not refused" | tee -a "$LOG"; exit 1; }
          # No AGOS_API_KEY (open code-exec policy, R-100): even an authenticated
          # tenant's submitted code must NOT run.
          tid=$(curl -s -X POST http://localhost:18000/api/tasks -H 'Content-Type: application/json' \
                -H "X-API-Key: $CI_TENANT_KEY" \
                -d '{"specialization":"test_runner","prompt":"print(1)"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["task_id"])')
          for i in $(seq 1 20); do
            curl -s -H "X-API-Key: $CI_TENANT_KEY" "http://localhost:18000/api/tasks/$tid" > /tmp/task.json
            grep -q '"status": *"\(completed\|failed\)"' /tmp/task.json && break
            sleep 0.5
          done
          echo "open_mode_test_runner:" | tee -a "$LOG"; cat /tmp/task.json | tee -a "$LOG"; echo | tee -a "$LOG"
          grep -q 'disabled in open mode' /tmp/task.json || { echo "FAIL: open-mode code execution not refused" | tee -a "$LOG"; exit 1; }
          echo "PASS: non-root container; anonymous access refused (401); open-mode code execution refused" | tee -a "$LOG"

      - name: Collect diagnostics
        if: always()
        run: |
          docker ps -a | tee "$GITHUB_WORKSPACE/docker_ps.log" || true
          docker inspect agos-r040 > "$GITHUB_WORKSPACE/docker_inspect.json" 2>&1 || true

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-verification-logs
          path: |
            docker_build.log
            docker_runtime.log
            docker_startup_refusal.log
            docker_container.log
            docker_ps.log
            docker_inspect.json
          if-no-files-found: error

      - name: Clean up
        if: always()
        run: |
          docker rm -f agos-r040 || true
          docker rmi agos:r040-smoke || true

  audit:
    # R-045: dependency vulnerability audit in CI (pip-audit + npm audit).
    # Blocking on critical/high; moderate/low reported but non-blocking (dev-only deps).
    runs-on: ubuntu-26.04
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pip-audit (locked)
        run: pip install --require-hashes -r requirements-audit.lock

      - name: Python dependency audit (requirements.lock — full resolved set)
        run: |
          set -o pipefail
          pip-audit -r requirements.lock 2>&1 | tee "$GITHUB_WORKSPACE/pip_audit.log"
          # R-148: audits the locked resolved set (all transitives), not just the
          # direct requirements. pip-audit exits 1 if vulnerabilities found — blocking.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'   # R-089 (D-042)

      - name: Web dependency audit (production deps only)
        working-directory: web/
        run: |
          npm ci --engine-strict --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          # Blocking on critical/high in production deps (react/react-dom).
          # Dev deps are covered by the full audit below (blocking since R-071).

      - name: Web dependency audit (full — blocking since R-071)
        working-directory: web/
        run: |
          set -o pipefail
          npm audit --audit-level=high 2>&1 | tee "$GITHUB_WORKSPACE/npm_audit_full.log"
          # R-071: vite 5 -> 8 closed the two dev-only advisories (esbuild/vite) that
          # made this step informational since R-045; it now blocks on high/critical
          # in dev deps too. See docs/governance/SECURITY.md R-071.

      # R-203 (D-152, DEL-001): the root npm audit steps went with the root app.

  storage:
    # R-042: live storage verification against PostgreSQL + PostgREST — the
    # engine Supabase runs. Applies docs/sql/001_init.sql, round-trips every
    # supabase_store.py call over HTTP and runs server.py end-to-end with
    # storage configured (tests/test_r042_live_storage.py). Blocking.
    # Hosted Supabase itself is NOT exercised here (no owner credentials) —
    # see docs/governance/DECISIONS.md D-038.
    runs-on: ubuntu-26.04
    needs: [quality, test]
    # R-202 (D-151): the official pgvector image = PostgreSQL 17 + the `vector`
    # extension that the v2 schema (docs/sql/v2/001_core.sql) needs. The v1
    # stack below runs on it unchanged.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (locked)
        run: |
          python -m pip install pip==26.2.1  # R-148: pinned (was a floating upgrade)
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Install PostgREST v12.2.3 (checksum-pinned)
        run: |
          # D-145 (log 397): two checksum failures with no diagnostics; root cause not proven.
          # --fail stops an HTTP error body from being saved as the archive; retries cover
          # transient errors only; on mismatch the size/digest/type are printed. The pinned
          # sha256 stays mandatory and is never skipped or relaxed.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o /tmp/pgrst.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          if ! echo "9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c  /tmp/pgrst.tar.xz" | sha256sum -c -; then
            echo "checksum mismatch: size=$(stat -c %s /tmp/pgrst.tar.xz) sha256=$(sha256sum /tmp/pgrst.tar.xz | cut -d' ' -f1)"
            file /tmp/pgrst.tar.xz || true
            exit 1
          fi
          tar -xf /tmp/pgrst.tar.xz -C /tmp

      - name: Verify storage layer + server end-to-end
        env:
          ADMIN_URI: postgresql://postgres:postgres@localhost:5432/agos
          AUTH_URI: postgresql://authenticator:authenticator@localhost:5432/agos
          POSTGREST_BIN: /tmp/postgrest
          # R-161: the runner's report for the same local stack (local_integration)
          R161_REPORT: ${{ github.workspace }}/r161_storage_local.json
        run: |
          set -o pipefail
          bash scripts/r042/run_local_stack.sh 2>&1 | tee "$GITHUB_WORKSPACE/r042_storage.log"

      - name: R-202 v2 schema on a test database (apply + contracts + RLS)
        env:
          # superuser on the same service; the test creates and drops its own
          # database (agos_v2_r202_test) — v1 tables are not touched.
          V2_SCHEMA_ADMIN_URI: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          set -o pipefail
          python -m pytest tests/test_r202_v2_schema.py -v -p no:cacheprovider 2>&1 | tee "$GITHUB_WORKSPACE/r202_v2_schema.log"
          grep -q " passed" "$GITHUB_WORKSPACE/r202_v2_schema.log"
          # the live tests must RUN here, not skip
          if grep -qE "[0-9]+ skipped" "$GITHUB_WORKSPACE/r202_v2_schema.log"; then
            echo "::error::R-202 live schema tests were skipped"; exit 1
          fi

      - name: Install Supabase Auth (GoTrue) v2.197.0 (checksum-pinned)
        run: |
          # R-204 (D-153): the auth server Supabase runs, from its official release.
          # Same rules as PostgREST above: --fail, transient retries, mandatory sha256.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 \
            -o /tmp/gotrue.tar.gz https://github.com/supabase/auth/releases/download/v2.197.0/auth-v2.197.0-x86.tar.gz
          if ! echo "9daff5d1939c3142a1586e435e6e2a7a2f71534ec40ff1b196b59b83ad5678f3  /tmp/gotrue.tar.gz" | sha256sum -c -; then
            echo "checksum mismatch: size=$(stat -c %s /tmp/gotrue.tar.gz) sha256=$(sha256sum /tmp/gotrue.tar.gz | cut -d' ' -f1)"
            exit 1
          fi
          mkdir -p /tmp/gotrue && tar -xzf /tmp/gotrue.tar.gz -C /tmp/gotrue
          test -x /tmp/gotrue/auth && test -d /tmp/gotrue/migrations

      - name: R-204 accounts + R-205 BYOK (real Supabase Auth + RLS isolation + API end-to-end + key leak tests)
        env:
          V2_SCHEMA_ADMIN_URI: postgresql://postgres:postgres@localhost:5432/postgres
          GOTRUE_BIN: /tmp/gotrue/auth
        run: |
          set -o pipefail
          python -m pytest tests/test_r204_accounts_db.py tests/test_r204_accounts_live.py tests/test_r205_byok_live.py -v -p no:cacheprovider 2>&1 | tee "$GITHUB_WORKSPACE/r204_accounts.log"
          grep -q " passed" "$GITHUB_WORKSPACE/r204_accounts.log"
          # the live tests must RUN here, not skip
          if grep -qE "[0-9]+ skipped" "$GITHUB_WORKSPACE/r204_accounts.log"; then
            echo "::error::R-204/R-205 live accounts/BYOK tests were skipped"; exit 1
          fi

      - name: Upload storage verification log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r042-storage-verification-log
          path: |
            r042_storage.log
            r161_storage_local.json
            r202_v2_schema.log
            r204_accounts.log

  network:
    # R-072 (RISK-019): the internet-facing agents (researcher / api_integrator /
    # network_client) against the REAL internet — `pytest -m network`.
    # Deliberately NOT a required status check: an outage of DuckDuckGo, DNS or
    # Wikipedia must not block merges, but a failure stays visible on the PR.
    # The deterministic suite (job `test`) runs these agents on a fake transport.
    runs-on: ubuntu-26.04
    needs: [quality]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies (locked)
        run: |
          python -m pip install pip==26.2.1  # R-148: pinned (was a floating upgrade)
          pip install --require-hashes -r requirements.lock
          pip install --require-hashes -r requirements-dev.lock  # httpx2: starlette.testclient, needed at collection
      - name: Live network tests
        run: pytest tests/ -m network -v

  publish:
    runs-on: ubuntu-26.04
    needs: build
    # PyPI publish gated by R-030 (policy decision pending) — disabled until decided.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish]')
    steps:
      - uses: actions/checkout@v7
      
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: echo "PyPI publish disabled by R-030 (policy pending)."
