name: R-161 Live Integration (manual)

# R-161 (D-073): opt-in LIVE integration against an OWNER-PROVISIONED,
# isolated staging account (test project / test key / test endpoint).
# * Manual only (workflow_dispatch): never on push or pull_request, so no PR —
#   and no fork — can read the staging credentials.
# * environment r161-staging: the owner creates it (Settings > Environments)
#   with required reviewers BEFORE the first run, and stores the temporary
#   test credentials there. Until then every target is BLOCKED (exit 2) —
#   never PASS. Runbook: docs/governance/OPERATIONS.md (R-161).
# * The runner refuses non-https, non-allowlisted or non-public endpoints and
#   credentials without a declared expiry <= 7 days (scripts/r161_live_integration.py).
# * The job fails unless every requested target PASSed: a provider failure,
#   a timeout, a malformed answer or a failed cleanup is red, not green.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: "comma list of: storage,llm,external,mcp"
        required: true
        default: "storage,llm,external,mcp"
      credential_expires_at:
        description: "UTC ISO-8601 time the temporary test credentials expire (at most 7 days ahead), e.g. 2026-10-20T00:00:00Z"
        required: true

permissions:
  contents: read

concurrency:
  group: r161-live-integration
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-26.04
    environment: r161-staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies (locked)
        run: |
          python -m pip install pip==26.2.1
          pip install --require-hashes -r requirements.lock

      - name: Run the integration runner
        # inputs reach the shell only through env (no ${{ }} inside the script)
        env:
          TARGETS: ${{ inputs.targets }}
          R161_LIVE: "1"
          R161_CREDENTIAL_EXPIRES_AT: ${{ inputs.credential_expires_at }}
          R161_ALLOWED_HOSTS: ${{ vars.R161_ALLOWED_HOSTS }}
          R161_TIMEOUT_S: "30"
          R161_STORAGE_URL: ${{ vars.R161_STORAGE_URL }}
          R161_STORAGE_KEY: ${{ secrets.R161_STORAGE_KEY }}
          R161_LLM_URL: ${{ vars.R161_LLM_URL }}
          R161_LLM_MODEL: ${{ vars.R161_LLM_MODEL }}
          R161_LLM_API_KEY: ${{ secrets.R161_LLM_API_KEY }}
          R161_EXTERNAL_URL: ${{ vars.R161_EXTERNAL_URL }}
          R161_EXTERNAL_MODEL: ${{ vars.R161_EXTERNAL_MODEL }}
          R161_EXTERNAL_API_KEY: ${{ secrets.R161_EXTERNAL_API_KEY }}
        run: |
          set +e
          python scripts/r161_live_integration.py --targets "$TARGETS" --report r161_report.json
          rc=$?
          echo "== Check the report for secret values (it must not be uploaded otherwise)"
          python - <<'PY'
          import os, pathlib, sys
          p = pathlib.Path("r161_report.json")
          text = p.read_text() if p.exists() else ""
          leaked = [n for n in ("R161_STORAGE_KEY", "R161_LLM_API_KEY", "R161_EXTERNAL_API_KEY")
                    if len(os.environ.get(n, "")) >= 4 and os.environ[n] in text]
          if leaked:
              p.unlink()
              print("FAIL: report contained the value of " + ", ".join(leaked) + " — not uploaded")
              sys.exit(1)
          print("report checked: no secret value present")
          PY
          check=$?
          [ "$check" -eq 0 ] || rc=1
          echo "runner_rc=$rc" | tee r161_rc.txt

      - name: Upload the redacted report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r161-integration-report
          path: r161_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail unless every requested target passed
        run: |
          rc=$(sed -n 's/^runner_rc=//p' r161_rc.txt)
          echo "runner exit code: ${rc:-missing} (0 PASS, 1 FAIL, 2 BLOCKED, 3 nothing ran)"
          [ "${rc:-1}" = "0" ]
