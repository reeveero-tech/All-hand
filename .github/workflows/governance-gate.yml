name: Governance Gate

# R-020: enforce the atomic-batch rule on PRs targeting main.
# A PR that changes code/config/data must, in the SAME PR diff, also touch
# the corresponding governance docs (ROADMAP, PROJECT_STATE, CHANGELOG,
# and the specific docs implied by the change). Docs-only PRs still need
# ROADMAP/PROJECT_STATE/CHANGELOG updates (they name the work item).

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

jobs:
  governance:
    # PR-scoped only: it reads github.event.pull_request.number (R-186),
    # which does not exist on push events.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # R-152 (D-063/D-064): zero tracked files deleted, moved or renamed in
      # the PR's net diff (origin/main...HEAD). No in-repo override exists:
      # owner-authorized deletions need a separate documented decision.
      - name: No-delete check (R-152)
        run: python3 scripts/check_no_delete.py origin/main HEAD

      # Log 295: unresolved merge-conflict markers added by the PR (a rebase
      # once committed them into ROADMAP/PROJECT_STATE/CHANGELOG unnoticed).
      - name: Conflict-marker check
        if: ${{ !cancelled() }}
        run: python3 scripts/check_conflict_markers.py origin/main HEAD

      - name: Atomic batch check
        # run even if the no-delete step failed, so both verdicts are reported
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "changed files:"; echo "$CHANGED"

          # Always required whenever ANYTHING changes in the PR (docs-only included):
          # the work item must be visible in ROADMAP/PROJECT_STATE/CHANGELOG.
          MANDATORY=(docs/governance/ROADMAP.md docs/governance/PROJECT_STATE.md docs/governance/CHANGELOG.md)
          MISSING=()
          for f in "${MANDATORY[@]}"; do
            if ! grep -qxF "$f" <<< "$CHANGED"; then MISSING+=("$f"); fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Atomic batch rule violated: these mandatory docs must be updated in the same PR: ${MISSING[*]}"
            exit 1
          fi

          # Conditional rules keyed on the kind of change:
          CODE_RE='^(server\.py|run\.py|agent_civilization/|agos_kernel/|src/|web/|tests/)'
          if grep -Eq "$CODE_RE" <<< "$CHANGED"; then
            grep -qxE 'docs/audit/.+' <<< "$CHANGED" \
              || { echo "::error::Code changed without evidence in docs/audit/"; exit 1; }
          fi
          if grep -Eq '^server\.py|agent_civilization/civilization_routes\.py' <<< "$CHANGED"; then
            grep -qxF 'docs/governance/API.md' <<< "$CHANGED" \
              || { echo "::error::API changed without docs/governance/API.md"; exit 1; }
          fi
          if grep -Eq 'agent_civilization/storage/' <<< "$CHANGED"; then
            grep -qxF 'docs/governance/DATA_MODEL.md' <<< "$CHANGED" \
              || { echo "::error::Storage changed without docs/governance/DATA_MODEL.md"; exit 1; }
          fi
          if grep -Eq '^\.github/workflows/' <<< "$CHANGED"; then
            grep -qxF 'docs/governance/QUALITY.md' <<< "$CHANGED" \
              || { echo "::error::CI changed without docs/governance/QUALITY.md"; exit 1; }
          fi

          echo "Governance gate passed."

      # R-186 (D-097, 2026-10-21 incident): PRs #215/#216/#217 were merged
      # from the owner account while their titles/bodies said "DO NOT MERGE"
      # / "لا يُدمج". This required check FAILS while the PR's live state
      # carries an explicit hold marker, so the marker cannot be merged
      # around (with enforce_admins on; see ROADMAP R-186).
      - name: Do-not-merge hold check (R-186)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_do_not_merge.py --repo-pr "$GITHUB_REPOSITORY" "${{ github.event.pull_request.number }}"

      # R-153 (D-065): stricter, unit-tested superset of the inline check
      # above (which stays unchanged). Wider "executable" set needs
      # docs/audit evidence; runtime Python / web source need tests.
      - name: Atomic batch check v2 (R-153)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_atomic_batch.py origin/main HEAD

      # R-154 (D-066): status vocabulary + evidence sufficiency for ROADMAP
      # items (docs/governance/STATUS_DEFINITIONS.md §3). Needs full history
      # (fetch-depth: 0 above) to verify merge_sha^2 == tested_sha.
      - name: Status evidence check (R-154)
        if: ${{ !cancelled() }}
        run: python3 scripts/check_status_evidence.py .

  # R-187 (D-102): the owner's single binding rule — documentation travels
  # WITH every push, not only in PR aggregate diffs. Two paths, ONE context:
  # - push events: same-event scope github.event.before..after (branch
  #   creation: the branch's own commits vs origin/main).
  # - pull_request events: bind the verdict to the delivery head — verify
  #   the head SHA has a green push-event run of this check ON THE HEAD
  #   BRANCH (the same SHA pushed elsewhere satisfies nothing; a red docless
  #   push on the head keeps the merge blocked). The PR path verifies
  #   explicitly — it never relies on what a skip would or would not mean.
  # Honest limit: CI runs after the ref update, so this cannot reject a push
  # from ARRIVING — it fails the run loudly and blocks MERGES via the
  # required context. A check that starts after a push event cannot prevent
  # that push itself from arriving.
  push-scope-docs:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push-scope docs check (R-187)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            python3 scripts/check_push_docs.py "${{ github.event.before }}" "${{ github.event.after }}"
          else
            python3 scripts/verify_push_scope_head.py "$GITHUB_REPOSITORY" "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.head.ref }}"
          fi
